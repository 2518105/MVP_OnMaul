name: 알림 발송 스케줄 (한마디 리마인드 / 주간 공지 / 주간 메달)

on:
  schedule:
    # 모두 13:00 KST(UTC+9) = 04:00 UTC 실행. 시각/요일을 바꾸려면 이 cron 표현식들만 수정하면 됨.
    - cron: '0 4 * * 1,3,5'  # 월/수/금: 오늘의 한마디 미작성자에게 리마인드
    - cron: '0 4 * * 6'      # 토: 전체 구독자에게 주간 공지 알림
    - cron: '0 4 * * 0'      # 일: 전체 구독자에게 주간 메달 알림

  # 수동 실행 (GitHub Actions 페이지 > Run workflow) — 시나리오를 직접 골라 테스트 가능
  workflow_dispatch:
    inputs:
      scenario:
        description: '보낼 알림 (비워두면 오늘 요일 기준으로 자동 결정)'
        type: choice
        options:
          - auto
          - daily_reminder
          - weekly_notice
          - weekly_medal
        default: auto

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: 오늘 요일에 맞는 알림 발송
        env:
          NOTIFY_SECRET: ${{ secrets.NOTIFY_SECRET }}
          API_URL: https://onmaeul.onrender.com
          MANUAL_SCENARIO: ${{ github.event.inputs.scenario }}
        run: |
          WEEKDAY=$(date -u +%u)  # 1=월 ... 6=토 7=일

          if [ -n "$MANUAL_SCENARIO" ] && [ "$MANUAL_SCENARIO" != "auto" ]; then
            SCENARIO="$MANUAL_SCENARIO"
          elif [ "$WEEKDAY" = "6" ]; then
            SCENARIO="weekly_notice"
          elif [ "$WEEKDAY" = "7" ]; then
            SCENARIO="weekly_medal"
          else
            SCENARIO="daily_reminder"
          fi

          echo "발송 시나리오: $SCENARIO"

          if [ "$SCENARIO" = "daily_reminder" ]; then
            curl -sS -X POST "$API_URL/api/notifications/remind-daily-answer" \
              -H "X-Notify-Secret: $NOTIFY_SECRET" -w "\nHTTP %{http_code}\n"
          else
            curl -sS -X POST "$API_URL/api/notifications/notify-all?template=$SCENARIO" \
              -H "X-Notify-Secret: $NOTIFY_SECRET" -w "\nHTTP %{http_code}\n"
          fi
