name: 오늘의 한마디 리마인드 알림

on:
  schedule:
    # 매일 20:00 KST (UTC+9) = UTC 11:00 실행
    # 발송 시각/횟수를 바꾸려면 아래 cron 표현식만 수정하면 됨 (여러 줄 추가 시 하루 여러 번 발송)
    - cron: '0 11 * * *'

  # 수동 실행 (GitHub Actions 페이지 > Run workflow)
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest

    steps:
      - name: 오늘의 한마디 미작성자에게 리마인드 발송 요청
        env:
          NOTIFY_SECRET: ${{ secrets.NOTIFY_SECRET }}
          API_URL: https://onmaeul.onrender.com
        run: |
          curl -sS -X POST "$API_URL/api/notifications/remind-daily-answer" \
            -H "X-Notify-Secret: $NOTIFY_SECRET" \
            -w "\nHTTP %{http_code}\n"
